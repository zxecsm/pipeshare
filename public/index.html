        const sendTextBtn = $('send-text-btn');
        const sendClipboardBtn = $('send-clipboard-btn');

        const transferBox = $('transfer-box');
        const transferList = $('transfer-list');
        const transferCount = $('transfer-count');

        const confirmOverlay = $('custom-confirm');
        const modalTitle = $('modal-title');
        const modalContent = $('modal-content');
        const modalConfirmBtn = $('modal-confirm-btn');
        const modalCancelBtn = $('modal-cancel-btn');

        const qrModal = $('qr-modal');
        const qrImg = $('qr-img');
        const qrUrlEl = $('qr-url');
        const qrCloseBtn = $('qr-close-btn');
        const qrCopyBtn = $('qr-copy-btn');

        const alertEl = $('custom-alert');
        const alertIcon = $('alert-icon');
        const alertText = $('alert-text');

        /* ------------------------------ 本地状态 ------------------------------ */
        const socket = io({
          reconnection: true,
          reconnectionAttempts: Infinity,
          reconnectionDelay: 500,
          reconnectionDelayMax: 5000,
          randomizationFactor: 0.5,
        });

        let nickname = localStorage.getItem('pipeshare:nickname') || '';
        let currentRoom = null;
        let selfId = null;
        let selfName = '';
        let joined = false;
        let connected = false;
        let pendingJoinCode = null;
        let alertTimeout = null;

        const MAX_BATCH_FILES = 8;
        // 超过这个大小只用于提示接收端内存占用，传输方式始终是内存合并后下载
        const LARGE_FILE_THRESHOLD = 256 * 1024 * 1024;
        let selectedFiles = [];

        const pendingSends = new Map(); // clientTaskId -> { file, fileName }
        const taskLabels = new Map(); // clientTaskId / taskToken -> 文件名
        const incomingBatches = new Map(); // batchId -> { files, total, timer, seen }
        const transferState = new Map(); // clientTaskId / taskToken -> 进度卡片状态
        const sendStates = new Map(); // taskToken -> 发送端分片状态（窗口 / ack）
        const receiveStates = new Map(); // taskToken -> 接收端内存合并状态
        const receiveBatches = new Map(); // batchId -> { queue: taskToken[], active }
        const taskBatch = new Map(); // taskToken -> batchId

        let wakeLock = null;
        let wakeLockWanted = false;
        let wakeLockRequesting = false;
        let wakeLockFailed = false;

        let deferredInstallPrompt = null;

        const dialogQueue = [];
        let activeDialog = null;

        nicknameInput.value = nickname;

        /* ------------------------------ 通用工具 ------------------------------ */
        function formatBytes(size) {
          size = Number(size);
          if (isNaN(size) || size < 0) return '0 B';

          const units = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
          let idx = 0;
          while (size >= 1024 && idx < units.length - 1) {
            size /= 1024;
            idx += 1;
          }
          return `${size.toFixed(size >= 100 || idx === 0 ? 0 : 2)} ${units[idx]}`;
        }

        function formatDuration(ms) {
          const value = Number(ms);
          if (!isFinite(value) || value <= 0) return '';
          if (value < 1000) return `${Math.max(1, Math.round(value))} ms`;
          return `${(value / 1000).toFixed(value < 10000 ? 1 : 0)} s`;
        }

        function normalizeCode(raw) {
          return String(raw || '')
            .toUpperCase()
            .replace(/[^A-Z0-9]/g, '')
            .slice(0, 12);
        }

        function randomId() {
          if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
          return `c_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
        }

        function storageGet(key) {
          try {
            return localStorage.getItem(key) || '';
          } catch {
            return '';
          }
        }

        function storageSet(key, value) {
          try {
            localStorage.setItem(key, value);
          } catch {
            /* 隐私模式下可能不可用 */
          }
        }

        function storageRemove(key) {
          try {
            localStorage.removeItem(key);
          } catch {
            /* ignore */
          }
        }

        function timeStr() {
          return new Date().toLocaleTimeString();
        }

        function trimLog() {
          while (logBox.childElementCount > 400) {
            logBox.removeChild(logBox.firstElementChild);
          }
        }

        function printLog(msg, type = 'info') {
          const emoji = type === 'success' ? '✅' : type === 'error' ? '❌' : '>';
          const line = document.createElement('div');
          line.textContent = `${emoji} [${timeStr()}] ${msg}`;
          if (type === 'error') line.style.color = '#ff6b6b';
          else if (type === 'success') line.style.color = '#4cd964';
          logBox.appendChild(line);
          trimLog();
          logBox.scrollTop = logBox.scrollHeight;
        }

        /* ---------------------------- 传输进度卡片 ---------------------------- */
        function createTransferItem(item) {
          const el = document.createElement('div');
          el.className = 'transfer-item';

          const head = document.createElement('div');
          head.className = 'transfer-head';
          const dirEl = document.createElement('span');
          dirEl.className = 'transfer-dir';
          const nameEl = document.createElement('span');
          nameEl.className = 'transfer-name';
          const statusEl = document.createElement('span');
          statusEl.className = 'transfer-status';
          head.append(dirEl, nameEl, statusEl);

          const track = document.createElement('div');
          track.className = 'progress-track';
          const fillEl = document.createElement('div');
          fillEl.className = 'progress-fill';
          track.appendChild(fillEl);

          const meta = document.createElement('div');
          meta.className = 'transfer-meta';
          const leftEl = document.createElement('span');
          const rightEl = document.createElement('span');
          meta.append(leftEl, rightEl);

          el.append(head, track, meta);
          transferList.appendChild(el);

          item.el = el;
          item.dirEl = dirEl;
          item.nameEl = nameEl;
          item.statusEl = statusEl;
          item.fillEl = fillEl;
          item.metaLeftEl = leftEl;
          item.metaRightEl = rightEl;
        }

        function getTransfer(key) {
          return key ? transferState.get(key) : null;
        }

        function setTransfer(key, patch = {}) {
          if (!key) return null;
          let item = transferState.get(key);
          if (!item) {
            item = {
              key,
              name: '文件',
              total: 0,
              loaded: 0,
              status: '等待确认',
              direction: 'out',
              speed: 0,
              lastAt: 0,
              lastLoaded: 0,
              removeTimer: null,
            };
            transferState.set(key, item);
            createTransferItem(item);
          }

          if (item.removeTimer) {
            clearTimeout(item.removeTimer);
            item.removeTimer = null;
          }
          Object.assign(item, patch);
          renderTransfer(item);
          updateTransferBox();
          return item;
        }

        function renderTransfer(item) {
          if (!item || !item.el) return;
          const total = Number(item.total) || 0;
          const loaded = Math.max(0, Number(item.loaded) || 0);
          const terminal = item.status === '已完成' || item.status === '已中断' || item.status === '已拒绝';
          let percent = total > 0 ? Math.min(100, (loaded / total) * 100) : 0;
          if (item.status === '已完成') percent = 100;

          item.dirEl.textContent = item.direction === 'in' ? '📥' : '📤';
          item.nameEl.textContent = item.name;
          item.nameEl.title = item.name;
          item.statusEl.textContent = item.status;
          item.fillEl.style.width = `${percent}%`;
          item.fillEl.classList.toggle('done', item.status === '已完成');
          item.fillEl.classList.toggle(
            'error',
            item.status === '已中断' || item.status === '已拒绝',
          );

          const sizeText =
            total > 0
              ? `${formatBytes(loaded)} / ${formatBytes(total)}`
              : formatBytes(loaded);
          item.metaLeftEl.textContent = sizeText;
          if (item.speed > 0 && !terminal) {
            item.metaRightEl.textContent = `${formatBytes(item.speed)}/s`;
          } else {
            item.metaRightEl.textContent =
              total > 0 && !terminal
                ? `${Math.round(percent)}%`
                : '';
          }
        }

        function updateTransferBytes(key, loaded, total, status) {
          const item = getTransfer(key);
          if (!item) return;
          // 完成/失败后，允许迟到的进度事件被忽略，避免状态从“已完成”回退成“推送中”
          if (
            item.status === '已完成' ||
            item.status === '已中断' ||
            item.status === '已拒绝'
          ) {
            return;
          }
          const now = Date.now();
          const nextLoaded = Math.max(item.loaded, Number(loaded) || 0);

          if (item.lastAt && now > item.lastAt) {
            const seconds = (now - item.lastAt) / 1000;
            const delta = nextLoaded - item.lastLoaded;
            if (seconds >= 0.2 && delta >= 0) {
              const instant = delta / seconds;
              item.speed = item.speed > 0
                ? item.speed * 0.65 + instant * 0.35
                : instant;
              item.lastAt = now;
              item.lastLoaded = nextLoaded;
            }
          } else {
            item.lastAt = now;
            item.lastLoaded = nextLoaded;
          }

          item.loaded = nextLoaded;
          if (Number(total) > 0) item.total = Number(total);
          if (status) item.status = status;
          renderTransfer(item);
        }

        function finishTransfer(key, status, delayMs = 0, loaded) {
          const item = getTransfer(key);
          if (!item) return;
          item.status = status;
          if (typeof loaded === 'number') item.loaded = loaded;
          if (status === '已完成' && item.total > 0) item.loaded = item.total;
          item.speed = 0;
          renderTransfer(item);
          if (delayMs > 0) {
            if (item.removeTimer) clearTimeout(item.removeTimer);
            item.removeTimer = setTimeout(() => removeTransfer(key), delayMs);
          }
        }

        function removeTransfer(key) {
          const item = getTransfer(key);
          if (!item) return;
          if (item.removeTimer) clearTimeout(item.removeTimer);
          if (item.el) item.el.remove();
          transferState.delete(key);
          updateTransferBox();
        }

        function updateTransferBox() {
          const count = transferState.size;
          transferCount.textContent = `${count} 个`;
          transferBox.classList.toggle('hidden', count === 0);
        }

        function clearAllTransfers() {
          for (const item of transferState.values()) {
            if (item.removeTimer) clearTimeout(item.removeTimer);
            if (item.el) item.el.remove();
          }
          transferState.clear();
          updateTransferBox();
        }

        function hasActiveTransfers() {
          for (const item of transferState.values()) {
            if (item.status !== '已完成' && item.status !== '已中断' && item.status !== '已拒绝') {
              return true;
            }
          }
          return false;
        }

        function taskKey(data) {
          if (!data) return '';
          if (data.clientTaskId && transferState.has(data.clientTaskId)) {
            return data.clientTaskId;
          }
          if (data.taskToken && transferState.has(data.taskToken)) {
            return data.taskToken;
          }
          return data.clientTaskId || data.taskToken || '';
        }

        function taskLabel(data) {
          return (
            taskLabels.get(data.clientTaskId) ||
            taskLabels.get(data.taskToken) ||
            '文件'
          );
        }

        function cleanupTask(data, options = {}) {
          const ids = [data.clientTaskId, data.taskToken].filter(Boolean);
          ids.forEach((id) => {
            taskLabels.delete(id);
            pendingSends.delete(id);
            if (!options.keepTransfer) removeTransfer(id);
          });
          if (data.taskToken) {
            const send = sendStates.get(data.taskToken);
            if (send) send.aborted = true;
            sendStates.delete(data.taskToken);
          }
        }

        function memberName(id) {
          const item = devicesDiv.querySelector(`[data-member-id="${id}"]`);
          return item ? item.dataset.memberName : '对方设备';
        }

        /* ------------------------------ Toast ------------------------------ */
        function showAlert(message, icon = '💡', duration = 3000) {
          if (alertTimeout) clearTimeout(alertTimeout);
          alertIcon.textContent = icon;
          alertText.textContent = message;
          alertEl.classList.add('active');
          alertTimeout = setTimeout(() => {
            alertEl.classList.remove('active');
          }, duration);
        }

        /* ---------------------------- 异步确认框队列 ---------------------------- */
        function showCustomConfirm(title, message, meta = {}) {
          return new Promise((resolve) => {
            dialogQueue.push({ title, message, meta, resolve });
            if (!activeDialog) nextDialog();
          });
        }

        function showInfo(title, message) {
          return showCustomConfirm(title, message, { info: true });
        }

        function nextDialog() {
          if (activeDialog) return;
          const dialog = dialogQueue.shift();
          if (!dialog) return;

          activeDialog = dialog;
          modalTitle.textContent = dialog.title;
          modalContent.textContent = dialog.message;
          modalConfirmBtn.textContent =
            dialog.meta && dialog.meta.info ? '知道了' : '确定';
          modalCancelBtn.classList.toggle(
            'hidden',
            Boolean(dialog.meta && dialog.meta.info),
          );
          confirmOverlay.classList.add('active');
        }

        function finishDialog(result) {
          if (!activeDialog) return;
          const dialog = activeDialog;
          activeDialog = null;
          confirmOverlay.classList.remove('active');
          dialog.resolve(result);
          setTimeout(nextDialog, 150);
        }

        function dialogTaskTokens(dialog) {
          const meta = (dialog && dialog.meta) || {};
          if (Array.isArray(meta.tasks)) return meta.tasks.slice();
          return meta.taskToken ? [meta.taskToken] : [];
        }

        function cancelDialogForTask(taskToken) {
          if (!taskToken) return false;

          if (activeDialog) {
            const tokens = dialogTaskTokens(activeDialog);
            if (tokens.includes(taskToken)) {
              if (Array.isArray(activeDialog.meta.tasks)) {
                activeDialog.meta.tasks = tokens.filter((t) => t !== taskToken);
                if (activeDialog.meta.tasks.length === 0) {
                  finishDialog('cancelled');
                }
              } else {
                finishDialog('cancelled');
              }
              return true;
            }
          }

          for (let i = 0; i < dialogQueue.length; i += 1) {
            const dialog = dialogQueue[i];
            const tokens = dialogTaskTokens(dialog);
            if (!tokens.includes(taskToken)) continue;

            if (Array.isArray(dialog.meta.tasks)) {
              dialog.meta.tasks = tokens.filter((t) => t !== taskToken);
              if (dialog.meta.tasks.length > 0) return true;
            }
            dialogQueue.splice(i, 1);
            dialog.resolve('cancelled');
            return true;
          }
          return false;
        }

        function cancelAllDialogs() {
          if (activeDialog) finishDialog('cancelled');
          while (dialogQueue.length) {
            dialogQueue.shift().resolve('cancelled');
          }
        }

        modalConfirmBtn.onclick = () => finishDialog(true);
        modalCancelBtn.onclick = () => finishDialog(false);

        // 点击遮罩不关闭（避免误触丢失邀请），仅二维码弹窗支持点击外部关闭
        qrModal.addEventListener('click', (event) => {
          if (event.target === qrModal) closeQrModal();
        });

        /* ---------------------------- 复制到剪贴板 ---------------------------- */
        function fallbackCopyText(content) {
          try {
            const temp = document.createElement('div');
            const selection = window.getSelection();
            const range = document.createRange();

            temp.textContent = content;
            temp.style.position = 'fixed';
            temp.style.opacity = '0';
            temp.style.pointerEvents = 'none';

            document.body.appendChild(temp);
            range.selectNode(temp);
            selection.removeAllRanges();
            selection.addRange(range);

            const success = document.execCommand('copy');
            selection.removeAllRanges();
            temp.remove();
            return success;
          } catch {
            return false;
          }
        }

        async function copyText(content) {
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(content);
              return true;
            }
            throw new Error('clipboard unavailable');
          } catch {
            return fallbackCopyText(content);
          }
        }

        /* ------------------------------ 视图切换 ------------------------------ */
        function renderWakeStatus() {
          if (!joined) {
            wakeStatusEl.classList.add('hidden');
            return;
          }
          wakeStatusEl.classList.remove('hidden');

          if (!('wakeLock' in navigator)) {
            wakeStatusEl.textContent = '☀️ 常亮不可用';
            wakeStatusEl.classList.add('offline');
            wakeStatusEl.title =
              '当前浏览器或 HTTP 环境不支持屏幕常亮（需要 HTTPS 或 localhost），请保持页面在前台';
            return;
          }
          if (wakeLock) {
            wakeStatusEl.textContent = '☀️ 页面保持活跃';
            wakeStatusEl.classList.remove('offline');
            wakeStatusEl.title = '已启用屏幕常亮，传输期间设备不会自动休眠';
          } else if (wakeLockFailed) {
            wakeStatusEl.textContent = '☀️ 常亮不可用';
            wakeStatusEl.classList.add('offline');
            wakeStatusEl.title =
              '浏览器或系统拒绝了屏幕常亮请求，请保持页面在前台，或改用 HTTPS 访问';
          } else {
            wakeStatusEl.textContent = wakeLockRequesting
              ? '☀️ 正在保持活跃…'
              : '☀️ 常亮待恢复';
            wakeStatusEl.classList.add('offline');
            wakeStatusEl.title = '页面回到前台后会自动恢复屏幕常亮';
          }
        }

        async function acquireWakeLock() {
          if (
            !wakeLockWanted ||
            !joined ||
            !('wakeLock' in navigator) ||
            document.visibilityState !== 'visible'
          ) {
            renderWakeStatus();
            return;
          }
          if (wakeLock || wakeLockRequesting) {
            renderWakeStatus();
            return;
          }

          wakeLockRequesting = true;
          wakeLockFailed = false;
          renderWakeStatus();
          try {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLockFailed = false;
            wakeLock.addEventListener('release', () => {
              wakeLock = null;
              renderWakeStatus();
            });
          } catch {
            wakeLock = null;
            wakeLockFailed = true;
          } finally {
            wakeLockRequesting = false;
            renderWakeStatus();
          }
        }

        async function releaseWakeLock() {
          wakeLockWanted = false;
          if (wakeLock) {
            const current = wakeLock;
            wakeLock = null;
            try {
              await current.release();
            } catch {
              /* 可能已经自动释放 */
            }
          }
          renderWakeStatus();
        }

        /* ------------------------------ PWA 安装 ------------------------------ */
        function isStandaloneMode() {
          return (
            window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone === true
          );
        }

        function isIosDevice() {
          const ua = navigator.userAgent || '';
          if (/iPad|iPhone|iPod/.test(ua)) return true;
          return navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
        }

        function updateInstallButtons() {
          const show =
            !isStandaloneMode() &&
            (Boolean(deferredInstallPrompt) || isIosDevice());
          [installAppBtn, installAppBtnRoom].forEach((button) => {
            if (button) button.classList.toggle('hidden', !show);
          });
        }

        async function promptInstall() {
          if (deferredInstallPrompt) {
            const promptEvent = deferredInstallPrompt;
            deferredInstallPrompt = null;
            try {
              promptEvent.prompt();
              const choice = await promptEvent.userChoice;
              if (choice && choice.outcome === 'accepted') {
                showAlert('正在安装 PipeShare…', '📲', 4000);
              }
            } catch {
              showAlert('安装窗口打开失败，请使用浏览器菜单手动安装。', '⚠️', 4000);
            }
            updateInstallButtons();
            return;
          }

          if (isIosDevice()) {
            await showInfo(
              '📲 添加到主屏幕',
              'iPhone / iPad 需要手动添加：\n\n1. 点击浏览器底部或顶部的「分享」按钮\n2. 向下滚动，选择「添加到主屏幕」\n3. 点击右上角「添加」\n\n添加后从主屏幕图标打开，即可获得独立应用体验。',
            );
            return;
          }

          showAlert(
            '请使用浏览器菜单中的「安装应用」或「添加到主屏幕」。',
            '📲',
            5000,
          );
        }

        window.addEventListener('beforeinstallprompt', (event) => {
          event.preventDefault();
          deferredInstallPrompt = event;
          updateInstallButtons();
        });

        window.addEventListener('appinstalled', () => {
          deferredInstallPrompt = null;
          updateInstallButtons();
          showAlert('PipeShare 已安装到设备！', '🎉', 4000);
        });

        if (window.matchMedia) {
          const standaloneQuery = window.matchMedia('(display-mode: standalone)');
          if (standaloneQuery.addEventListener) {
            standaloneQuery.addEventListener('change', updateInstallButtons);
          }
        }

        [installAppBtn, installAppBtnRoom].forEach((button) => {
          if (button) button.onclick = promptInstall;
        });

        // Service Worker 只在 HTTPS / localhost 下注册，用于 PWA 安装与离线外壳
        if ('serviceWorker' in navigator && window.isSecureContext) {
          window.addEventListener('load', () => {
            navigator.serviceWorker
              .register(new URL('sw.js', window.location.href).href)
              .catch(() => {
                /* 离线能力不可用时不影响主功能 */
              });
          });
        }

        /* ------------------------------ 系统通知 ------------------------------ */
        function notificationsSupported() {
          return 'Notification' in window && window.isSecureContext;
        }

        function isPageActive() {
          // 页面可见且窗口处于焦点状态时，用户已经能看到页面提示，不再重复弹系统通知
          return (
            document.visibilityState === 'visible' && document.hasFocus()
          );
        }

        function renderNotifyStatus() {
          if (!joined) {
            notifyStatusEl.classList.add('hidden');
            return;
          }
          notifyStatusEl.classList.remove('hidden');
          notifyStatusEl.classList.remove('on', 'off');

          if (!notificationsSupported()) {
            notifyStatusEl.textContent = '🔕 通知不可用';
            notifyStatusEl.classList.add('off');
            notifyStatusEl.title =
              '系统通知需要 HTTPS 或 localhost 环境，请使用 HTTPS 访问';
            return;
          }

          if (Notification.permission === 'granted') {
            notifyStatusEl.textContent = '🔔 通知已开启';
            notifyStatusEl.classList.add('on');
            notifyStatusEl.title =
              '页面不在前台时，收到文本或文件会弹出系统通知；点击通知可回到当前页面';
          } else if (Notification.permission === 'denied') {
            notifyStatusEl.textContent = '🔕 通知被拒绝';
            notifyStatusEl.classList.add('off');
            notifyStatusEl.title =
              '通知权限已被拒绝，请在浏览器站点设置中重新允许';
          } else {
            notifyStatusEl.textContent = '🔔 开启通知';
            notifyStatusEl.classList.add('off');
            notifyStatusEl.title = '点击授权系统通知，收到消息时会弹出提醒';
          }
        }

        async function requestNotificationPermission({ interactive = true } = {}) {
          if (!notificationsSupported()) {
            if (interactive) {
              showAlert('系统通知需要 HTTPS 或 localhost 环境。', '🔕', 5000);
            }
            renderNotifyStatus();
            return false;
          }

          if (Notification.permission === 'granted') {
            if (interactive) showAlert('系统通知已开启。', '🔔');
            renderNotifyStatus();
            return true;
          }

          if (Notification.permission === 'denied') {
            if (interactive) {
              showAlert(
                '通知权限已被拒绝，请在浏览器的站点设置中重新允许。',
                '🔕',
                5000,
              );
            }
            renderNotifyStatus();
            return false;
          }

          try {
            const permission = await Notification.requestPermission();
            renderNotifyStatus();
            if (permission === 'granted') {
              if (interactive) showAlert('系统通知已开启！', '🔔');
              return true;
            }
            if (interactive) showAlert('未开启系统通知。', '🔕', 3000);
          } catch {
            if (interactive) showAlert('无法获取通知权限。', '⚠️', 3000);
          }
          return Notification.permission === 'granted';
        }

        async function showSystemNotification(title, options = {}) {
          if (
            !notificationsSupported() ||
            Notification.permission !== 'granted' ||
            isPageActive()
          ) {
            return false;
          }

          const iconUrl = new URL('icons/icon-192.png', window.location.href).href;
          const payload = {
            body: String(options.body || '').slice(0, 200),
            icon: iconUrl,
            lang: 'zh-CN',
            data: { url: window.location.href },
          };
          if (options.tag) payload.tag = String(options.tag).slice(0, 64);

          try {
            const registration =
              'serviceWorker' in navigator
                ? await navigator.serviceWorker.getRegistration()
                : null;

            if (registration && typeof registration.showNotification === 'function') {
              await registration.showNotification(title, payload);
              return true;
            }

            if (typeof Notification === 'function') {
              const note = new Notification(title, payload);
              note.onclick = () => {
                note.close();
                window.focus();
              };
              return true;
            }
          } catch {
            /* 通知失败不影响主功能 */
          }
          return false;
        }

        notifyStatusEl.onclick = () => requestNotificationPermission();

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            renderNotifyStatus();
          }
        });
        window.addEventListener('focus', renderNotifyStatus);

        function setConnectionState(online) {
          connected = online;
          if (online) {
            connStatus.classList.remove('offline');
            connText.textContent = '已连接';
          } else {
            connStatus.classList.add('offline');
            connText.textContent = '重连中…';
          }
          refreshSendButtons();
        }

        function refreshSendButtons() {
          const hasTarget = Boolean(targetSelect.value);
          sendBtn.disabled =
            !connected || !hasTarget || selectedFiles.length === 0;
          sendTextBtn.disabled = !connected || !hasTarget;
          sendClipboardBtn.disabled = !connected || !hasTarget;
        }

        function showGate() {
          appView.classList.add('hidden');
          gateView.classList.remove('hidden');
          joined = false;
          currentRoom = null;
          selfId = null;
          selfName = '';
          cancelAllDialogs();
          pendingSends.clear();
          taskLabels.clear();
          incomingBatches.forEach((batch) => {
            if (batch.timer) clearTimeout(batch.timer);
          });
          incomingBatches.clear();
          clearAllTransfers();
          selectedFiles = [];
          renderSelectedFiles();
          releaseWakeLock();
          renderNotifyStatus();
          closeQrModal();
        }

        function showApp() {
          gateView.classList.add('hidden');
          appView.classList.remove('hidden');
        }

        function resetToGate(message, icon) {
          showGate();
          clearRoomInUrl();
          if (message) showAlert(message, icon || '👋');
          joinCodeInput.value = '';
        }

        function setRoomInUrl(code) {
          try {
            const url = new URL(window.location.href);
            url.searchParams.set('room', code);
            window.history.replaceState(null, '', url);
          } catch {
            /* 忽略隐私模式等环境限制 */
          }
        }

        function clearRoomInUrl() {
          try {
            const url = new URL(window.location.href);
            if (!url.searchParams.has('room')) return;
            url.searchParams.delete('room');
            window.history.replaceState(null, '', url);
          } catch {
            /* ignore */
          }
        }

        function inviteUrl(code = currentRoom) {
          const url = new URL(window.location.href);
          url.search = '';
          url.hash = '';
          url.searchParams.set('room', code);
          return url.toString();
        }

        function closeQrModal() {
          qrModal.classList.remove('active');
          qrImg.removeAttribute('src');
        }

        /* ------------------------------ 房间渲染 ------------------------------ */
        function renderMembers(members) {
          devicesDiv.textContent = '';

          if (!Array.isArray(members) || members.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'device-empty';
            empty.textContent = '房间里还没有其他设备，邀请好友扫码加入吧。';
            devicesDiv.appendChild(empty);
          }

          // 同名设备自动追加短 ID，避免选择接收目标时产生歧义
          const nameCounts = new Map();
          members.forEach((member) => {
            nameCounts.set(member.name, (nameCounts.get(member.name) || 0) + 1);
          });
          const labelOf = (member) =>
            nameCounts.get(member.name) > 1
              ? `${member.name} (#${member.id.substring(0, 4)})`
              : member.name;

          members.forEach((member) => {
            const item = document.createElement('div');
            item.className = 'device-item';
            item.dataset.memberId = member.id;
            item.dataset.memberName = labelOf(member);

            const nameSpan = document.createElement('span');
            nameSpan.textContent = `💻 ${labelOf(member)}`;
            if (member.id === selfId || member.id === socket.id) {
              const badge = document.createElement('span');
              badge.className = 'self-badge';
              badge.textContent = '我';
              nameSpan.appendChild(badge);
            }
            item.appendChild(nameSpan);
            devicesDiv.appendChild(item);
          });

          const others = members.filter(
            (m) => m.id !== selfId && m.id !== socket.id,
          );
          memberCountEl.textContent = `${members.length} 台`;

          const previous = targetSelect.value;
          targetSelect.textContent = '';

          if (others.length === 0) {
            const opt = document.createElement('option');
            opt.value = '';
            opt.textContent = '房间内暂无其他设备';
            targetSelect.appendChild(opt);
          } else {
            others.forEach((member) => {
              const opt = document.createElement('option');
              opt.value = member.id;
              opt.textContent = labelOf(member);
              targetSelect.appendChild(opt);
            });
            if (previous && others.some((m) => m.id === previous)) {
              targetSelect.value = previous;
            }
          }

          refreshSendButtons();
        }

        /* ------------------------------ Tab 切换 ------------------------------ */
        document.querySelectorAll('.tab-btn').forEach((btn) => {
          btn.onclick = () => {
            document
              .querySelectorAll('.tab-content')
              .forEach((panel) => panel.classList.remove('active'));
            document
              .querySelectorAll('.tab-btn')
              .forEach((item) => item.classList.remove('active'));
            $(btn.dataset.panel).classList.add('active');
            btn.classList.add('active');
          };
        });

        /* ------------------------------ 连接生命周期 ------------------------------ */
        socket.on('connect', () => {
          setConnectionState(true);
          printLog('成功连接到中转信令服务器', 'success');

          if (currentRoom) {
            printLog(`连接已恢复，正在重新进入房间 ${currentRoom}…`);
            socket.emit('room:join', {
              roomCode: currentRoom,
              nickname: nickname || selfName,
            });
          } else if (pendingJoinCode) {
            socket.emit('room:join', {
              roomCode: pendingJoinCode,
              nickname: nickname || undefined,
            });
            pendingJoinCode = null;
          }
        });

        socket.on('disconnect', (reason) => {
          setConnectionState(false);
          printLog('与服务器的连接已断开，正在自动重连…', 'error');
          cancelAllDialogs();
          pendingSends.clear();
          taskLabels.clear();
          sendStates.forEach((state) => {
            state.aborted = true;
          });
          sendStates.clear();
          receiveStates.forEach((state) => {
            state.failed = true;
            state.chunks = [];
          });
          receiveStates.clear();
          receiveBatches.clear();
          taskBatch.clear();
          incomingBatches.forEach((batch) => {
            if (batch.timer) clearTimeout(batch.timer);
          });
          incomingBatches.clear();
          clearAllTransfers();

          if (
            reason !== 'io client disconnect' &&
            reason !== 'io server disconnect'
          ) {
            showAlert('连接中断，正在自动重连…', '📡', 4000);
          }
        });

        socket.on('connect_error', () => {
          setConnectionState(false);
        });

        /* ------------------------------ 房间事件 ------------------------------ */
        socket.on('room:joined', (data) => {
          currentRoom = data.code;
          selfId = data.selfId;
          selfName = data.selfName;
          joined = true;
          pendingJoinCode = null;

          roomCodeEl.textContent = data.code;
          setRoomInUrl(data.code);
          renderMembers(data.members);
          showApp();
          setConnectionState(socket.connected);
          wakeLockWanted = true;
          acquireWakeLock();
          renderNotifyStatus();
          printLog(`已进入私有房间 ${data.code}`, 'success');
        });

        socket.on('room:update', (data) => {
          if (!currentRoom || data.code !== currentRoom) return;
          renderMembers(data.members);
        });

        socket.on('room:left', () => {
          resetToGate('已退出房间。', '👋');
        });

        socket.on('room:error', (data) => {
          const message = (data && data.message) || '进入房间失败。';
          printLog(message, 'error');
          showAlert(message, '⚠️', 4000);
          pendingJoinCode = null;

          // 重连时房间已过期 / 已满，或邀请码无效：退回入口页并保留房间码方便重试
          const retryCode = (data && data.code) || joinCodeInput.value;
          showGate();
          clearRoomInUrl();
          joinCodeInput.value = retryCode || '';
        });

        socket.on('server:ready', () => {
          /* 预留：服务端能力探测 */
        });

        /* ------------------------------ 创建 / 加入房间 ------------------------------ */
        createRoomBtn.onclick = () => {
          if (!socket.connected) {
            return showAlert('尚未连接到服务器，请稍候…', '📡');
          }
          void requestNotificationPermission({ interactive: false });
          const name = nicknameInput.value.trim();
          nickname = name;
          if (name) storageSet('pipeshare:nickname', name);
          else storageRemove('pipeshare:nickname');

          createRoomBtn.disabled = true;
          socket.emit('room:create', { nickname: name || undefined });
          setTimeout(() => {
            createRoomBtn.disabled = false;
          }, 1200);
        };

        function joinRoom(code) {
          const normalized = normalizeCode(code);
          if (!normalized) {
            return showAlert('请输入房间码。', '⌨️');
          }
          if (!socket.connected) {
            pendingJoinCode = normalized;
            return showAlert('尚未连接到服务器，连接后将自动加入。', '📡');
          }

          const name = nicknameInput.value.trim();
          nickname = name;
          if (name) storageSet('pipeshare:nickname', name);
          else storageRemove('pipeshare:nickname');

          socket.emit('room:join', {
            roomCode: normalized,
            nickname: name || undefined,
          });
          joinCodeInput.value = normalized;
        }

        joinRoomBtn.onclick = () => {
          void requestNotificationPermission({ interactive: false });
          joinRoom(joinCodeInput.value);
        };
        joinCodeInput.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') joinRoomBtn.click();
        });
        joinCodeInput.addEventListener('input', () => {
          const pos = joinCodeInput.selectionStart;
          joinCodeInput.value = normalizeCode(joinCodeInput.value);
          joinCodeInput.setSelectionRange(pos, pos);
        });

        leaveRoomBtn.onclick = async () => {
          const hasActive = pendingSends.size > 0 || hasActiveTransfers();
          if (hasActive) {
            const ok = await showCustomConfirm(
              '确认退出房间',
              '退出房间会中断所有进行中的传输，确定要退出吗？',
            );
            if (!ok) return;
          }
          if (!socket.connected) {
            resetToGate('已退出房间。', '👋');
            return;
          }
          socket.emit('room:leave');
        };

        /* ------------------------------ 邀请 / 二维码 ------------------------------ */
        copyInviteBtn.onclick = async () => {
          if (!currentRoom) return;
          const url = inviteUrl();
          const ok = await copyText(url);
          showAlert(
            ok ? '邀请链接已复制，发给好友即可加入！' : '复制失败，请手动复制。',
            ok ? '🔗' : '❌',
          );
        };

        showQrBtn.onclick = () => {
          if (!currentRoom) return;
          const url = inviteUrl();
          qrUrlEl.textContent = url;
          // 服务端生成 SVG，内网无外网也能扫码
          qrImg.src = `/api/qr?text=${encodeURIComponent(url)}`;
          qrModal.classList.add('active');
        };

        qrCloseBtn.onclick = closeQrModal;
        qrCopyBtn.onclick = async () => {
          const ok = await copyText(qrUrlEl.textContent || '');
          showAlert(ok ? '邀请链接已复制！' : '复制失败，请手动复制。', '🔗');
        };

        /* ------------------------------ 文本发送 ------------------------------ */
        function canSendText() {
          if (!joined) {
            showAlert('请先加入一个房间。', '🔒');
            return false;
          }
          if (!connected) {
            showAlert('连接已断开，正在重连…', '📡');
            return false;
          }
          if (!targetSelect.value) {
            showAlert('房间内还没有其他设备。', '⚠️');
            return false;
          }
          return true;
        }

        function deliverText(text) {
          const targetId = targetSelect.value;
          socket.emit('text-share', { targetId, content: text });
          printLog(`正在向 [${memberName(targetId)}] 投递文本内容…`);
        }

        sendTextBtn.onclick = () => {
          // 仅要求非空：空格、换行等空白字符也允许发送，不做 trim
          const text = textInput.value;

          if (!canSendText()) return;
          if (text.length === 0) return showAlert('请输入需要传输的文本内容。', '📝');

          deliverText(text);
          textInput.value = '';
        };

        sendClipboardBtn.onclick = async () => {
          if (!canSendText()) return;

          let text = '';
          try {
            // 必须在用户点击的同步阶段调用 readText，等待任何异步操作后再读会丢失手势授权
            if (!navigator.clipboard || !navigator.clipboard.readText) {
              throw new Error('clipboard unsupported');
            }
            text = (await navigator.clipboard.readText()) || '';
          } catch {
            return showAlert(
              '无法读取剪贴板：请通过 HTTPS 或 localhost 访问并允许剪贴板权限，也可以手动粘贴到输入框后发送。',
              '📋',
              5000,
            );
          }

          // 仅要求非空：空格、换行等空白字符也允许发送，不做 trim
          if (text.length === 0) {
            return showAlert('剪贴板中没有可发送的文本内容。', '📋');
          }
          if (new Blob([text]).size > 256 * 1024) {
            return showAlert('剪贴板文本超过 256KB，无法发送。', '⚠️', 4000);
          }

          textInput.value = text;
          deliverText(text);
        };

        /* ------------------------------ 文件发送 ------------------------------ */
        function renderSelectedFiles() {
          selectedFilesDiv.textContent = '';
          const totalSize = selectedFiles.reduce(
            (sum, file) => sum + (Number(file.size) || 0),
            0,
          );

          fileSummary.classList.toggle('hidden', selectedFiles.length === 0);
          if (selectedFiles.length > 0) {
            fileSummaryText.textContent = `已选择 ${selectedFiles.length} 个文件，共 ${formatBytes(totalSize)}`;
          }

          selectedFiles.forEach((file, index) => {
            const item = document.createElement('div');
            item.className = 'file-item';

            const info = document.createElement('div');
            info.className = 'file-info';
            const name = document.createElement('span');
            name.className = 'file-name';
            name.textContent = file.name;
            name.title = file.name;
            const size = document.createElement('span');
            size.className = 'file-size';
            size.textContent = formatBytes(file.size);
            info.append(name, size);

            const remove = document.createElement('button');
            remove.type = 'button';
            remove.className = 'file-remove';
            remove.textContent = '✕';
            remove.title = '移除';
            remove.setAttribute('aria-label', `移除 ${file.name}`);
            remove.addEventListener('click', () => {
              selectedFiles.splice(index, 1);
              renderSelectedFiles();
            });

            item.append(info, remove);
            selectedFilesDiv.appendChild(item);
          });

          sendBtn.textContent =
            selectedFiles.length > 1
              ? `⚡ 发送 ${selectedFiles.length} 个文件`
              : '⚡ 发起文件快传';
          refreshSendButtons();
        }

        fileInput.addEventListener('change', () => {
          const incoming = Array.from(fileInput.files || []);
          // 立即清空原生 input，允许再次选择同一个文件；File 对象已经保存在内存里
          fileInput.value = '';
          if (incoming.length === 0) return;

          let added = 0;
          let duplicateCount = 0;
          let limitHit = false;

          for (const file of incoming) {
            if (selectedFiles.length >= MAX_BATCH_FILES) {
              limitHit = true;
              break;
            }
            const duplicate = selectedFiles.some(
              (item) =>
                item.name === file.name &&
                item.size === file.size &&
                item.lastModified === file.lastModified,
            );
            if (duplicate) {
              duplicateCount += 1;
              continue;
            }
            selectedFiles.push(file);
            added += 1;
          }

          if (limitHit) {
            showAlert(`单次最多选择 ${MAX_BATCH_FILES} 个文件。`, '⚠️', 4000);
          } else if (duplicateCount > 0) {
            showAlert('已忽略重复选择的文件。', '💡');
          } else if (added > 1) {
            printLog(`已选择 ${added} 个文件，可一次发送。`);
          }
          renderSelectedFiles();
        });

        clearFilesBtn.onclick = () => {
          selectedFiles = [];
          renderSelectedFiles();
        };

        sendBtn.onclick = () => {
          const targetId = targetSelect.value;

          if (!joined) return showAlert('请先加入一个房间。', '🔒');
          if (!connected) return showAlert('连接已断开，正在重连…', '📡');
          if (!targetId) return showAlert('房间内还没有其他设备。', '⚠️');
          if (selectedFiles.length === 0) {
            return showAlert('请先选择文件。', '📁');
          }

          const files = selectedFiles.slice(0, MAX_BATCH_FILES);
          const batchId = files.length > 1 ? randomId() : '';
          const batchTotal = files.length;
          const targetName = memberName(targetId);

          files.forEach((file, index) => {
            const clientTaskId = randomId();
            // 文件对象保存在内存里，后续推流靠 clientTaskId 精确匹配，
            // 即使用户立刻改选别的文件也不会串包。
            pendingSends.set(clientTaskId, { file, fileName: file.name });
            taskLabels.set(clientTaskId, file.name);
            setTransfer(clientTaskId, {
              name: file.name,
              total: file.size,
              loaded: 0,
              status: '等待确认',
              direction: 'out',
            });

            socket.emit('file-share-invite', {
              targetId,
              fileName: file.name,
              fileType: file.type,
              fileSize: file.size,
              clientTaskId,
              batchId,
              batchTotal,
              batchIndex: index + 1,
            });
          });

          printLog(
            files.length > 1
              ? `已向 [${targetName}] 发起 ${files.length} 个文件的传输邀请。`
              : `正在向 [${targetName}] 发起文件传输邀请：${files[0].name}`,
          );

          selectedFiles = [];
          renderSelectedFiles();
        };

        /* ------------------------------ 传输事件 ------------------------------ */
        socket.on('incoming-text', async (data) => {
          const senderName = data.senderName || '未知设备';
          const content = data.content || '';
          printLog(`收到来自 [${senderName}] 的文本数据！`, 'success');

          void showSystemNotification(`📥 收到 ${senderName} 的文本`, {
            body: content.length > 120 ? `${content.slice(0, 120)}…` : content,
            tag: `text-${data.senderId || 'unknown'}-${Date.now()}`,
          });

          const accept = await showCustomConfirm(
            '📥 收到文本数据',
            `来自【${senderName}】的文本：\n\n${content}\n\n是否复制到剪贴板？`,
          );

          if (accept === true) {
            const ok = await copyText(content);
            showAlert(
              ok ? '已复制到系统剪贴板！' : '复制失败，请在日志中手动复制。',
              ok ? '🎉' : '❌',
            );
          }
          printLog(`[文本内容] ${content}`);
        });

        /* ------------------------ 接收端：批量邀请聚合 ------------------------ */
        function queueIncomingFile(data) {
          const batchId = data.batchId || `single:${data.taskToken}`;
          const total = Math.max(1, Number(data.batchTotal) || 1);

          let batch = incomingBatches.get(batchId);
          if (!batch) {
            batch = { files: [], total, timer: null, seen: new Set() };
            incomingBatches.set(batchId, batch);
          }
          if (batch.seen.has(data.taskToken)) return;

          batch.seen.add(data.taskToken);
          batch.total = Math.max(batch.total, total);
          batch.files.push(data);

          taskLabels.set(data.clientTaskId, data.fileName);
          taskLabels.set(data.taskToken, data.fileName);
          setTransfer(data.clientTaskId || data.taskToken, {
            name: data.fileName,
            total: data.fileSize,
            loaded: 0,
            status: '等待确认',
            direction: 'in',
          });

          if (batch.timer) clearTimeout(batch.timer);
          if (batch.files.length >= batch.total) {
            flushIncomingBatch(batchId);
          } else {
            // 如果服务端拒绝了其中某个文件，收到的数量可能少于 batchTotal，
            // 500ms 后按实际收到的文件数兜底展示。
            batch.timer = setTimeout(() => flushIncomingBatch(batchId), 500);
          }
        }

        /* ------------------------ 接收端：分片合并 / 下载 ------------------------ */

        function triggerBlobDownload(url, fileName) {
          const link = document.createElement('a');
          link.style.display = 'none';
          link.href = url;
          if (fileName) link.download = fileName;
          document.body.appendChild(link);
          link.click();
          setTimeout(() => link.remove(), 1500);
        }

        function addManualDownloadLink(url, fileName) {
          const line = document.createElement('div');
          line.textContent = `> [${timeStr()}] ${fileName} 未自动保存？`;
          const link = document.createElement('a');
          link.href = url;
          link.download = fileName || 'download';
          link.textContent = '点此手动保存';
          link.style.color = '#7dd3fc';
          line.appendChild(link);
          logBox.appendChild(line);
          trimLog();
          logBox.scrollTop = logBox.scrollHeight;
        }

        /**
         * 所有文件统一先接收进内存（分片数组），全部到齐后再合并成 Blob
         * 并触发浏览器下载，不再请求磁盘写入权限。
         */
        function createReceiveState(file) {
          return {
            taskToken: file.taskToken,
            clientTaskId: file.clientTaskId,
            key: file.clientTaskId || file.taskToken,
            fileName: file.fileName,
            fileType: file.fileType,
            fileSize: Math.max(0, Number(file.fileSize) || 0),
            batchId: file.batchId || `single:${file.taskToken}`,
            chunks: [],
            chain: Promise.resolve(),
            received: 0,
            failed: false,
            started: false,
          };
        }

        function releaseReceiveState(state) {
          if (!state) return;
          receiveStates.delete(state.taskToken);
          state.chunks = [];
        }

        function failReceive(state, err) {
          if (!state || state.failed) return;
          state.failed = true;
          const message = (err && err.message) || '接收失败';
          printLog(`${state.fileName}：接收失败（${message}）`, 'error');
          socket.emit('file-receive-error', {
            taskToken: state.taskToken,
            message,
          });
          releaseReceiveState(state);
          finishReceiveBatchTask(state.taskToken);
        }

        function handleIncomingChunk(data) {
          if (!data || typeof data.taskToken !== 'string') return;
          const state = receiveStates.get(data.taskToken);
          if (!state || state.failed) return;

          const seq = Number(data.seq);
          // 串行处理：保证分片按到达顺序进入内存，处理完一片再回 ack
          state.chain = state.chain
            .then(async () => {
              if (state.failed) return;
              const raw = data.data;
              if (raw == null) throw new Error('分片数据为空');
              const bytes =
                raw instanceof Uint8Array ? raw : new Uint8Array(raw);

              state.chunks.push(bytes);

              state.received += bytes.byteLength;
              socket.emit('file-chunk-ack', {
                taskToken: state.taskToken,
                seq,
              });
              updateTransferBytes(
                state.key,
                state.received,
                state.fileSize,
                '接收中',
              );
            })
            .catch((err) => failReceive(state, err));
        }

        /** 所有分片都接收完且已 ack 后，服务端才会发 transfer-complete */
        async function finalizeReceive(taskToken) {
          const state = receiveStates.get(taskToken);
          if (!state) return;
          try {
            await state.chain;
          } catch {
            /* 错误已经在链路里处理 */
          }
          if (state.failed) return;

          const blob = new Blob(state.chunks, {
            type: state.fileType || 'application/octet-stream',
          });
          state.chunks = [];
          receiveStates.delete(taskToken);

          const url = URL.createObjectURL(blob);
          triggerBlobDownload(url, state.fileName);
          addManualDownloadLink(url, state.fileName);
          // 留足时间给手动保存入口，之后释放内存
          setTimeout(() => URL.revokeObjectURL(url), 10 * 60 * 1000);
        }

        function finishReceiveBatchTask(taskToken) {
          const batchId = taskBatch.get(taskToken);
          if (!batchId) return;
          taskBatch.delete(taskToken);
          const batch = receiveBatches.get(batchId);
          if (!batch) return;
          if (batch.active === taskToken) batch.active = null;
          startNextReceive(batchId);
        }

        function startNextReceive(batchId) {
          const batch = receiveBatches.get(batchId);
          if (!batch || batch.active) return;

          const taskToken = batch.queue.shift();
          if (!taskToken) {
            receiveBatches.delete(batchId);
            return;
          }

          const state = receiveStates.get(taskToken);
          if (!state) {
            // 该文件在排队期间已经失败/取消，直接看下一个
            startNextReceive(batchId);
            return;
          }

          batch.active = taskToken;
          setTransfer(state.key, { status: '接收中', direction: 'in' });

          // 内存接收不需要额外的落盘准备，直接让发送端开始推分片
          state.started = true;
          socket.emit('file-start', {
            taskToken,
            clientTaskId: state.clientTaskId,
          });
        }

        async function flushIncomingBatch(batchId) {
          const batch = incomingBatches.get(batchId);
          if (!batch) return;
          if (batch.timer) {
            clearTimeout(batch.timer);
            batch.timer = null;
          }
          incomingBatches.delete(batchId);

          const files = batch.files.slice();
          if (files.length === 0) return;

          const senderName = files[0].senderName || '未知设备';
          const totalSize = files.reduce(
            (sum, file) => sum + (Number(file.fileSize) || 0),
            0,
          );
          const isMulti = files.length > 1;
          const listText = files
            .map(
              (file, index) =>
                `${index + 1}. ${file.fileName}（${
                  file.fileSize ? formatBytes(file.fileSize) : '未知大小'
                }）`,
            )
            .join('\n');

          const isLarge = totalSize >= LARGE_FILE_THRESHOLD;
          const largeHint = isLarge
            ? '\n\n⚠️ 文件较大：接收期间会暂存在浏览器内存中，全部到齐后自动触发下载，请保持页面在前台并留意内存占用。'
            : '';

          const title = isMulti
            ? `📁 收到 ${files.length} 个文件`
            : '📁 收到文件传输邀请';
          const message = isMulti
            ? `来自【${senderName}】的 ${files.length} 个文件：\n\n${listText}\n\n合计 ${formatBytes(totalSize)}\n\n接收后依次暂存到内存，完成后自动下载。若浏览器提示“允许下载多个文件”，请点击允许。${largeHint}`
            : `【${senderName}】想给你发送一个文件：\n\n名称：${files[0].fileName}\n大小：${
                files[0].fileSize
                  ? formatBytes(files[0].fileSize)
                  : '未知大小'
              }\n\n接收后会先暂存到内存，完成后自动触发下载。${largeHint}`;

          printLog(
            isMulti
              ? `收到来自 [${senderName}] 的 ${files.length} 个文件邀请。`
              : `收到来自 [${senderName}] 的文件邀请：${files[0].fileName}`,
          );

          void showSystemNotification(
            isMulti
              ? `📥 收到 ${files.length} 个文件`
              : '📥 收到文件传输邀请',
            {
              body: isMulti
                ? `${senderName} 发来 ${files.length} 个文件：${listText.replace(/\n/g, '、')}`
                : `${senderName} 发来文件：${files[0].fileName}`,
              tag: `files-${batchId}`,
            },
          );

          const accept = await showCustomConfirm(title, message, {
            tasks: files.map((file) => file.taskToken),
            batchId,
          });

          if (accept === 'cancelled') {
            files.forEach((file) => {
              taskLabels.delete(file.clientTaskId);
              taskLabels.delete(file.taskToken);
              const key = file.clientTaskId || file.taskToken;
              if (getTransfer(key)) {
                finishTransfer(key, '已中断', 2500);
              }
            });
            return;
          }

          if (accept !== true) {
            files.forEach((file) => {
              socket.emit('file-share-decline', {
                taskToken: file.taskToken,
              });
              const key = file.clientTaskId || file.taskToken;
              if (getTransfer(key)) {
                finishTransfer(key, '已拒绝', 1500);
              }
              cleanupTask(
                { clientTaskId: file.clientTaskId, taskToken: file.taskToken },
                { keepTransfer: true },
              );
            });
            printLog(
              isMulti
                ? `已拒绝 ${files.length} 个文件。`
                : '已拒绝对方的文件传输邀请。',
            );
            return;
          }

          const accepted = [];
          for (const file of files) {
            receiveStates.set(file.taskToken, createReceiveState(file));
            taskBatch.set(file.taskToken, batchId);
            accepted.push(file);
          }

          if (accepted.length === 0) {
            showAlert('文件接收未能启动，请让对方重新发送。', '⚠️', 4000);
            return;
          }

          receiveBatches.set(batchId, {
            queue: accepted.map((file) => file.taskToken),
            active: null,
          });

          // 先把整批任务都 accept 掉，避免排在后面的文件邀请超时；
          // 真正的传输由 startNextReceive 逐个 file-start 触发。
          accepted.forEach((file) => {
            socket.emit('file-accept', {
              taskToken: file.taskToken,
              clientTaskId: file.clientTaskId,
            });
          });

          printLog(
            isMulti
              ? `已同意接收 ${accepted.length} 个文件，开始分片传输…`
              : '已同意接收，开始分片传输…',
          );

          startNextReceive(batchId);
        }

        socket.on('incoming-file', (data) => {
          queueIncomingFile(data);
        });

        // 发送端按窗口推来的文件分片：写完一片才回 ack，形成端到端背压
        socket.on('file-chunk', handleIncomingChunk);

        socket.on('invite-cancelled', (data) => {
          const { taskToken, clientTaskId } = data || {};
          cancelDialogForTask(taskToken);

          if (clientTaskId) taskLabels.delete(clientTaskId);
          if (taskToken) taskLabels.delete(taskToken);

          const key = clientTaskId || taskToken;
          if (key && getTransfer(key)) {
            const item = getTransfer(key);
            if (item.status === '等待确认') {
              finishTransfer(key, '已中断', 2500);
            } else {
              removeTransfer(key);
            }
          }
          // 具体原因由 transfer-error 统一提示，避免重复日志
        });

        /* ------------------------------ 发送端分片 ------------------------------ */

        /**
         * 让出主线程，让页面有机会渲染进度。
         * 用 MessageChannel 而不是 setTimeout：后台标签页的定时器会被节流到 1 次/秒，
         * 用定时器做让步会把后台传输速度压到几 MB/s 以下。
         */
        function yieldToEventLoop() {
          return new Promise((resolve) => {
            const channel = new MessageChannel();
            channel.port1.onmessage = () => {
              channel.port1.close();
              resolve();
            };
            channel.port2.postMessage(null);
          });
        }

        function maybeFinishSend(state) {
          if (state.aborted || state.completed) return;
          // 所有分片都已发送、且都收到接收方 ack，才算真正传完
          if (state.sentSeq >= state.totalChunks && state.inFlight === 0) {
            state.completed = true;
            sendStates.delete(state.taskToken);
            socket.emit('file-complete', {
              taskToken: state.taskToken,
              bytes: state.file.size,
            });
          }
        }

        async function pumpSend(state) {
          if (state.pumping || state.aborted || state.completed) return;
          state.pumping = true;
          try {
            while (
              !state.aborted &&
              !state.completed &&
              state.inFlight < state.windowSize &&
              state.sentSeq < state.totalChunks
            ) {
              const start = state.sentSeq * state.chunkSize;
              const end = Math.min(start + state.chunkSize, state.file.size);
              let buffer;
              try {
                buffer = await state.file.slice(start, end).arrayBuffer();
              } catch (err) {
                state.aborted = true;
                sendStates.delete(state.taskToken);
                printLog(
                  `读取本地文件失败：${err.message || '未知错误'}`,
                  'error',
                );
                socket.emit('file-send-error', {
                  taskToken: state.taskToken,
                  message: (err && err.message) || '读取失败',
                });
                return;
              }
              if (state.aborted) return;

              socket.emit('file-chunk', {
                taskToken: state.taskToken,
                seq: state.sentSeq,
                data: buffer,
              });
              state.sentSeq += 1;
              state.inFlight += 1;

              // 每读 8 片让出一次主线程，避免大文件把页面卡死
              if (state.sentSeq % 8 === 0) {
                await yieldToEventLoop();
              }
            }
            maybeFinishSend(state);
          } finally {
            state.pumping = false;
          }
        }

        socket.on('start-upload-now', (data) => {
          const { taskToken, clientTaskId } = data || {};
          const pending = pendingSends.get(clientTaskId);

          if (!pending) {
            printLog('收到推流指令，但本地文件上下文已丢失，已取消该任务。', 'error');
            socket.emit('file-share-cancel', { taskToken });
            return;
          }
          if (sendStates.has(taskToken)) return;

          const { file, fileName } = pending;
          const chunkSize = Math.max(
            1,
            Number(data.chunkSize) || 512 * 1024,
          );
          const windowSize = Math.max(
            1,
            Math.min(64, Number(data.windowSize) || 16),
          );

          const state = {
            taskToken,
            clientTaskId,
            file,
            fileName,
            chunkSize,
            windowSize,
            totalChunks: Math.ceil(file.size / chunkSize),
            sentSeq: 0,
            ackedSeq: -1,
            inFlight: 0,
            pumping: false,
            aborted: false,
            completed: false,
          };
          sendStates.set(taskToken, state);

          setTransfer(clientTaskId, {
            name: fileName,
            total: file.size,
            loaded: 0,
            status: '推送中',
            direction: 'out',
          });
          printLog(`对方已同意，开始分片推送：${fileName}`, 'success');
          void pumpSend(state);
        });

        socket.on('file-chunk-ack', (data) => {
          if (!data) return;
          const state = sendStates.get(data.taskToken);
          if (!state) return;

          const seq = Number(data.seq);
          if (!Number.isInteger(seq) || seq < 0) return;

          if (seq > state.ackedSeq) {
            state.ackedSeq = seq;
            state.inFlight = Math.max(0, state.sentSeq - (state.ackedSeq + 1));
          }
          updateTransferBytes(
            state.clientTaskId,
            Math.min((state.ackedSeq + 1) * state.chunkSize, state.file.size),
            state.file.size,
            '推送中',
          );
          void pumpSend(state);
        });

        socket.on('transfer-progress', (data) => {
          const key = taskKey(data);
          if (!key) return;
          const item = getTransfer(key);
          if (!item) return;
          updateTransferBytes(
            key,
            data.bytes,
            data.total,
            item.direction === 'in' ? '接收中' : '推送中',
          );
        });

        socket.on('transfer-complete', (data) => {
          const key = data.clientTaskId || data.taskToken;
          const item = getTransfer(key);
          const name = item ? item.name : taskLabel(data);
          const size = formatBytes(data.bytes || data.total || 0);
          const duration = formatDuration(data.durationMs);

          if (key) finishTransfer(key, '已完成', 2500);
          if (key) {
            const line = document.createElement('div');
            line.style.color = '#4cd964';
            line.textContent = `✅ [${timeStr()}] 传输完成：${name}（${size}${duration ? `，耗时 ${duration}` : ''}）`;
            logBox.appendChild(line);
            trimLog();
            logBox.scrollTop = logBox.scrollHeight;
          }
          cleanupTask(data, { keepTransfer: true });

          // 接收端：把内存分片合并成 Blob 触发下载，然后继续批次里的下一个
          if (data.taskToken && receiveStates.has(data.taskToken)) {
            void (async () => {
              try {
                await finalizeReceive(data.taskToken);
              } catch (err) {
                printLog(
                  `保存文件失败：${(err && err.message) || '未知错误'}`,
                  'error',
                );
              } finally {
                finishReceiveBatchTask(data.taskToken);
              }
            })();
          } else if (data.taskToken) {
            finishReceiveBatchTask(data.taskToken);
          }
        });

        socket.on('transfer-error', (data) => {
          const message = (data && data.message) || '传输发生错误。';
          printLog(message, 'error');
          const key = data && (data.clientTaskId || data.taskToken);
          if (key) {
            if (getTransfer(key)) {
              finishTransfer(key, /拒绝/.test(message) ? '已拒绝' : '已中断', 4000);
            }
            cleanupTask(data, { keepTransfer: true });
          }

          if (data && data.taskToken) {
            const state = receiveStates.get(data.taskToken);
            if (state) {
              releaseReceiveState(state);
            }
            finishReceiveBatchTask(data.taskToken);
          }
        });

        /* ------------------------------ 页面初始化 ------------------------------ */
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            if (joined) acquireWakeLock();
          }
        });

        // 有传输进行中时，刷新/关闭页面给出二次确认，避免误触导致中断
        window.addEventListener('beforeunload', (event) => {
          if (joined && (pendingSends.size > 0 || hasActiveTransfers())) {
            event.preventDefault();
            event.returnValue = '';
          }
        });

        function bootstrap() {
          const params = new URLSearchParams(window.location.search);
          const roomFromUrl = normalizeCode(params.get('room'));

          if (roomFromUrl) {
            joinCodeInput.value = roomFromUrl;
            pendingJoinCode = roomFromUrl;
            printLog(`检测到邀请房间 ${roomFromUrl}，正在加入…`);
          }

          setConnectionState(socket.connected);
          renderSelectedFiles();
          renderWakeStatus();
          renderNotifyStatus();
          updateInstallButtons();
          refreshSendButtons();
        }

        bootstrap();
      })();
    </script>
  </body>
</html>
